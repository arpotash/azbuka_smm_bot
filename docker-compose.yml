services:
  bot:
    build:
      context: .
      args:
        BASE_IMAGE: ${BASE_IMAGE:-python:3.12-slim}
    container_name: azbuka_ssm
    env_file: .env
    environment:
      DATA_DIR: /data
      TZ: ${TIMEZONE:-Europe/Moscow}
    volumes:
      - ./data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
